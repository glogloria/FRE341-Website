{% extends 'base/base.html' %}
{% load static %}

{% block title %}Produits{% endblock %}

{% block content %}

<div class="p-2">

    <section class="container py-5">
        <div class="text-center mb-5">
            <p class="text-uppercase small fw-bold text-secondary mb-2">Découvriez votre aventure prochain</p>
            <h2 class="display-5 fw-bold">Les produits</h2>
            <p class="text-muted mx-auto" style="max-width: 600px;">
                Une monde nouvelle dans votre attente.
            </p>
        </div>

        <div class="row row-cols-2 row-cols-md-3 g-4 g-lg-5">
            <div class="col">
                <div class="book-item h-100">
                    <img src="{% static 'public/img/freshwater.jpg' %}"
                        class="book-cover"
                        alt="Freshwater cover">
                </div>
            </div>

            <div class="col">
                <div class="book-item h-100">
                    <img src="{% static 'public/img/lentranger.jpg' %}"
                        class="book-cover"
                        alt="L'entranger cover">
                </div>
            </div>

            <div class="col">
                <div class="book-item h-100">
                    <img src="{% static 'public/img/miserables.jpg' %}"
                        class="book-cover"
                        alt="Les miserables cover">
                </div>
            </div>

            <div class="col">
                <div class="book-item h-100">
                    <img src="{% static 'public/img/madame.jpg' %}"
                        class="book-cover"
                        alt="Monte-cristo cover">
                </div>
            </div>

            <div class="col">
                <div class="book-item h-100">
                    <img src="{% static 'public/img/monte-cristo.jpg' %}"
                        class="book-cover"
                        alt="Book cover">
                </div>
            </div>

            <div class="col">
                <div class="book-item h-100">
                    <img src="{% static 'public/img/petit-prince.jpg' %}"
                        class="book-cover"
                        alt="Le petit prince cover">
                </div>
            </div>
        </div>
    </section>

</div>

{% endblock %}
